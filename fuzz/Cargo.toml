[package]
name = "solstice-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
solstice-gamestream = { path = "../crates/solstice-gamestream" }
solstice-vnc = { path = "../crates/solstice-vnc" }
solstice-backend = { path = "../crates/solstice-backend" }
solstice-spice = { path = "../crates/solstice-spice" }
solstice-spice-codec = { path = "../crates/solstice-spice-codec" }
solstice-audio = { path = "../crates/solstice-audio" }
bytes = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util"] }

[[bin]]
name = "rtsp_message"
path = "fuzz_targets/rtsp_message.rs"
test = false
doc = false

[[bin]]
name = "sdp_announce"
path = "fuzz_targets/sdp_announce.rs"
test = false
doc = false

[[bin]]
name = "input_batch"
path = "fuzz_targets/input_batch.rs"
test = false
doc = false

[[bin]]
name = "control_envelope"
path = "fuzz_targets/control_envelope.rs"
test = false
doc = false

[[bin]]
name = "rfb_rect"
path = "fuzz_targets/rfb_rect.rs"
test = false
doc = false

[[bin]]
name = "spice_quic"
path = "fuzz_targets/spice_quic.rs"
test = false
doc = false

[[bin]]
name = "spice_lz"
path = "fuzz_targets/spice_lz.rs"
test = false
doc = false

[[bin]]
name = "spice_draw"
path = "fuzz_targets/spice_draw.rs"
test = false
doc = false

[[bin]]
name = "spice_message"
path = "fuzz_targets/spice_message.rs"
test = false
doc = false

[[bin]]
name = "enet_host"
path = "fuzz_targets/enet_host.rs"
test = false
doc = false

[[bin]]
name = "audio_bridge"
path = "fuzz_targets/audio_bridge.rs"
test = false
doc = false

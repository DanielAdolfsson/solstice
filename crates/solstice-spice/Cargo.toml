[package]
name = "solstice-spice"
description = "SPICE client backend: channel links, the display rasteriser, inputs, cursor, agent and audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
solstice-backend.workspace = true
solstice-input.workspace = true
solstice-spice-codec.workspace = true

async-trait = "0.1"
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "io-util", "macros"] }

# The ticket is RSA-OAEP/MGF1-SHA-1 against a key the server mints per
# connection (`docs/spice-protocol.md` §2.2). `rsa` is already in the tree for
# GameStream pairing; SHA-1 arrives with it rather than on its own account.
rsa = "0.9"
sha1 = "0.10"

# TLS on every channel, which `docs/security.md` §4.2 requires: SPICE's ticket
# is a password check, not a key exchange.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
rustls-pemfile = "2.2"

# The three image codecs SPICE shares with the rest of the world. QUIC, LZ and
# GLZ are `solstice-spice-codec`; these are not that crate's business
# (`docs/spice-protocol.md` §5.1).
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "std"] }
zune-jpeg = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
missing_docs = "warn"

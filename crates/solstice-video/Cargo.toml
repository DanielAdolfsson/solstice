[package]
name = "solstice-video"
description = "Colour conversion, the synthetic frame clock, and the H.264 encoder abstraction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["x264", "openh264"]
# libx264, the default encoder: faster than OpenH264 on every changed frame,
# and its rate control turns the bitrate the client asks for into picture
# quality where OpenH264's settles near 38 dB whatever it is given
# (docs/roadmap.md Sec 6). Links the system libx264 (libx264-dev to build).
x264 = ["dep:solstice-x264"]
# OpenH264, built from vendored source: the fallback for a build without
# libx264. Install nasm before building, or its SIMD is silently left out and
# it runs up to three times slower (docs/roadmap.md Sec 6).
openh264 = ["dep:openh264"]

[dependencies]
solstice-backend.workspace = true
thiserror.workspace = true
tracing.workspace = true
openh264 = { version = "0.9", optional = true }
solstice-x264 = { workspace = true, optional = true }

[dev-dependencies]
# The decoder every encoder's output is checked with, whichever encoders are
# built.
openh264 = "0.9"

[lints.rust]
missing_docs = "warn"

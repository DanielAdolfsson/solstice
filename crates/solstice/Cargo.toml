[package]
name = "solstice"
description = "A proxy that lets a Moonlight client connect to a VNC or SPICE desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "solstice"

[features]
default = ["vnc", "x264", "openh264", "audio"]
vnc = ["dep:solstice-vnc"]
# The encoders. x264 is the default where it is built in; it links the system
# libx264. OpenH264 builds from vendored source and is the fallback.
x264 = ["solstice-video/x264"]
openh264 = ["solstice-video/openh264"]
# SPICE is deliberately excludable along with its dependency tree: it pulls
# in a JPEG decoder, LZ4, zlib and the image codecs, none of which an
# RFB-only build needs.
spice = ["dep:solstice-spice", "dep:solstice-spice-codec", "audio"]
# The Opus codec: libopus, built with CMake. Without it every stream still
# gets an audio channel, carrying canned stereo silence, and backend audio is
# dropped. On by default because it is also what makes a surround client's
# silence decodable.
audio = ["dep:solstice-audio"]

[dependencies]
solstice-backend.workspace = true
solstice-gamestream.workspace = true
solstice-video.workspace = true
solstice-audio = { workspace = true, optional = true }
solstice-spice = { workspace = true, optional = true }
solstice-spice-codec = { workspace = true, optional = true }
solstice-vnc = { workspace = true, optional = true }

bytes.workspace = true
serde = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["full"] }

clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-pemfile = "2.2"
humantime-serde = "1"
ipnet = { version = "2", features = ["serde"] }
hex = "0.4"
rand = "0.9"
async-trait = "0.1.92"
humantime = "2.4.0"

[dev-dependencies]
solstice-audio.workspace = true
solstice-test-guest.workspace = true
tokio = { workspace = true, features = ["full"] }
solstice-gamestream.workspace = true
openh264 = "0.9"
serde_json = "1"
rustls-pemfile = "2.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The independent ENet the control thread's own tests connect with, as
# `solstice-gamestream`'s interop suite does.
rusty_enet = "0.4"

[lints.rust]
missing_docs = "warn"

[package]
name = "solstice-vnc"
description = "RFB (VNC) client backend: handshake, encodings, framebuffer and input injection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
solstice-backend.workspace = true
solstice-input.workspace = true
async-trait = "0.1"
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "io-util", "macros"] }
flate2 = "1"
des = "0.8"
cipher = "0.4"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
rustls-pemfile = "2.2"

[dev-dependencies]
solstice-test-guest.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
missing_docs = "warn"

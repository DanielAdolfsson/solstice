[package]
name = "solstice-gamestream"
description = "The GameStream host half: NVHTTP, PIN pairing, RTSP, and the video/audio/control channels Moonlight expects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
solstice-backend.workspace = true
solstice-input.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "io-util", "macros"] }

aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
rsa = { version = "0.9", features = ["sha2"] }
pkcs8 = { version = "0.10", features = ["pem"] }
x509-parser = "0.18"
quick-xml = "0.41"
socket2 = "0.6"
# ring, not aws-lc-rs: aws-lc-sys needs cmake, which buys nothing here.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2.2"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
ipnet = "2.12.2"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = "1"

[lints.rust]
missing_docs = "warn"

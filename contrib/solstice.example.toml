# Solstice configuration.
#
# Every value below is the default; the file exists to document them. Read
# docs/security.md before changing `server.bind` or `security.allow_pairing_from`.

[server]
name      = "solstice"
# Not 0.0.0.0. Put Solstice behind WireGuard or Tailscale instead -- the
# GameStream pairing step is gated by a four-digit PIN over plaintext HTTP.
bind      = "127.0.0.1"
port      = 47989          # every other port is a fixed offset from this
state_dir = "/var/lib/solstice"
# The app title of an old single [backend] section; [[endpoint]] names its own.
app_title = "Desktop"

[security]
# Require SS_ENC_VIDEO | SS_ENC_AUDIO and refuse clients that will not
# negotiate them. The stream is someone's screen, not a game.
require_encryption = true
# Pairing is opened by `solstice pair --pin NNNN`, never by the config file;
# this is how long it stays open.
pairing_window     = "60s"
max_pair_attempts  = 3
# Empty means loopback only. Widen this deliberately, if at all.
allow_pairing_from = []

[limits]
max_sessions     = 1
max_width        = 1920
max_height       = 1080
max_fps          = 60
max_bitrate_kbps = 20000

[video]
encoder        = "openh264"
fec_percentage = 20
# Frames per second once the screen has been still for half a second. A repeat
# frame is a few bytes but nearly a full encode of CPU; any change goes out at
# the full rate regardless. Set to the stream's rate for a fixed-rate stream.
idle_fps       = 5

[audio]
# The backend's audio where it has any, silence otherwise. The RFB backend has
# none. The SPICE backend's is Opus, passed through when the client asked for
# 10 ms stereo and re-encoded to the client's layout otherwise.
enabled = true

# The remote desktops to offer, one Moonlight app each. None is the default,
# and a valid start: the daemon pairs, and Moonlight shows a placeholder,
# "No desktops on this host", until there is one.
# `solstice run --endpoint 'name=...,kind=...'` adds more, with the same keys,
# and `solstice endpoint add` / `remove` change a running daemon's until it
# stops.
#
# Each app's id is derived from its name, so a name is also an identity:
# renaming an endpoint makes it a new app to the client.
#
# Names are at most 64 characters, with no commas.
#
# [[endpoint]]
# name     = "Build box"
# kind     = "vnc"           # "vnc", "spice" (needs the `spice` Cargo feature) or "testpattern"
# host     = "127.0.0.1"
# port     = 5900
# # "none" and "vncauth" are refused against anything but loopback.
# security = "vencrypt"
# # password      = "..."   # or, as --endpoint must:
# # password_file = "/etc/solstice/build.pw"
# # ca_file       = "/etc/solstice/vnc-ca.pem"
# # Lift that refusal for this endpoint. Only for a server on this machine
# # that is not on loopback -- a VM on a host-only or Docker bridge -- where
# # the connection never crosses a network. Never for a real network hop.
# allow_insecure = false
#
# [[endpoint]]
# name     = "Windows VM"
# kind     = "spice"
# host     = "127.0.0.1"
# # The port to link on. With security = "tls" this is the server's *TLS*
# # port, which SPICE configures independently of the plain one and for which
# # there is no convention -- so set it explicitly. QEMU: -spice tls-port=5901,...
# port     = 5901
# # "tls" or "plain". "plain" is refused against anything but loopback: SPICE's
# # ticket is a password check, not a key exchange, so without TLS the display
# # and every keystroke are in the clear (docs/security.md 4.2).
# security = "tls"
# # As for vnc: lifts the refusal of "plain" off loopback, for a server on
# # this machine only.
# allow_insecure = false
# # The ticket password, where the server has ticketing enabled. A server run
# # with --disable-ticketing needs none.
# # password_file = "/etc/solstice/windows.pw"
# # ca_file       = "/etc/solstice/spice-ca.pem"
# # Open the playback channel: guest audio to the client. Off means silence.
# audio    = true
# # Let the server send video as MJPEG streams. Solstice re-encodes the whole
# # screen anyway, so a stream only adds a lossy generation; and behind a
# # non-QXL card one video becomes many streams, paced on their own, which
# # tears it apart. Off sends the same pixels losslessly as draw commands.
# video_streams = false
#
# [[endpoint]]
# name     = "Colour bars"
# kind     = "testpattern"   # takes no other keys
#
# The single [backend] section of older configurations still loads, as one
# endpoint with app id 1 named server.app_title.
